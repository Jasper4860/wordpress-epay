name: Plugin checks and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and payment regression checks
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build installable ZIP
        if: matrix.php == '8.4'
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: epay-plugin
          path: dist/epay-*.zip*
          if-no-files-found: error
